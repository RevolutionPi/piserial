# Build a snapshot debian package from current master
include:
  - project: "revolutionpi/infrastructure/ci-templates"
    file: "base.yml"
  - project: "revolutionpi/infrastructure/ci-templates"
    file: "global-vars.yml"
  - project: "revolutionpi/infrastructure/ci-templates"
    file: "package-devel.yml"
  - project: "revolutionpi/infrastructure/ci-templates"
    file: "/reuse-lint.yml"
  - project: "revolutionpi/infrastructure/ci-templates"
    file: "/check-commit/lint-commit.yml"
  - project: revolutionpi/infrastructure/ci-templates
    file: coverity-submit.yml
  - project: revolutionpi/infrastructure/ci-templates
    file: create-pristine-tar.yml
  - local: debian/gitlab-ci.yml
    rules:
      - exists:
          - debian/gitlab-ci.yml

variables:
  SRCPKG_NAME: piserial

static-analysis:
  stage: lint
  image: snowstep/llvm:bookworm
  tags:
    - self-hosted
    - docker
    - host-amd64
  script:
    - apt update && apt install -y libtss2-dev meson pkgconf git
    - meson setup -Dman-pages=disabled ../builddir
    - meson compile -C ../builddir
    - ninja -C ../builddir clang-tidy

coverity-submit:
  before_script:
    - apt update
    - apt-get build-dep -y piserial
    - meson setup builddir
    - export BUILD_CMD="meson compile -C builddir"
