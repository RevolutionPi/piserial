# Build a snapshot debian package from current master
include:
  - project: "revolutionpi/infrastructure/ci-templates"
    file: "base.yml"
  - project: "revolutionpi/infrastructure/ci-templates"
    file: "global-vars.yml"
  - project: "revolutionpi/infrastructure/ci-templates"
    file: "package-devel.yml"
  - project: "revolutionpi/infrastructure/ci-templates"
    file: "/reuse-lint.yml"
  - project: "revolutionpi/infrastructure/ci-templates"
    file: "/check-commit/lint-commit.yml"
  - project: revolutionpi/infrastructure/ci-templates
    file: create-pristine-tar.yml
  - local: debian/gitlab-ci.yml
    rules:
      - exists:
          - debian/gitlab-ci.yml

variables:
  SRCPKG_NAME: piserial

static-analysis:
  stage: lint
  image: snowstep/llvm:bookworm
  tags:
    - self-hosted
    - docker
    - host-amd64
  # install missing dependencies of container
  # create needed version.h file
  # run tidy with obsolete POSIX version functions
  script:
    - apt update && apt install -y libtss2-dev cmake scdoc
    - cmake
        -Bbuild -DCMAKE_C_CLANG_TIDY:STRING="clang-tidy"
        -DCMAKE_C_STANDARD="99"
        .
    - cmake --build build

coverity-submit:
  stage: publish
  image: registry.gitlab.com/revolutionpi/infrastructure/docker-images/build-container/build-container-trixie:arm64-latest
  tags:
    - self-hosted
    - host-arm64
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  variables:
    DEBIAN_FRONTEND: noninteractive
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = schedule ] \
        || [ "$CI_PIPELINE_SOURCE" = web ]; then
        # version should be dynamically retrieved
        git fetch -q --tags --unshallow origin
        VERSION="$(git describe --match "v*")"
      elif [ "$CI_COMMIT_TAG" ]; then
        VERSION="$CI_COMMIT_TAG"
      fi
    - printf 'Building and submitting version %s\n' "$VERSION"
    - apt update
    - apt-get build-dep -y piserial
    - |
      curl \
        -sSfLo /tmp/cov-analysis-linux-arm64.tar.gz \
        --form project="$CI_PROJECT_NAME" \
        --form token="$COVERITY_SCAN_TOKEN" \
        "https://scan.coverity.com/download/cxx/linux-ARM64"
    - tar -xzf /tmp/cov-analysis-linux-arm64.tar.gz
    - cmake -B build -G 'Unix Makefiles' .
    - ./cov-analysis-linux-arm64*/bin/cov-build
        --dir cov-int
        make -C build -j$(nproc)
    - tar -czf piserial.tar.gz cov-int
    - |
      curl -sSfL \
        --form token="$COVERITY_SCAN_TOKEN" \
        --form email="$CI_EMAIL" \
        --form file=@piserial.tar.gz \
        --form version="$VERSION" \
        --form description="Automated release submit for $VERSION" \
        "https://scan.coverity.com/builds?project=$CI_PROJECT_NAME"
